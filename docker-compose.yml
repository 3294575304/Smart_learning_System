# 单机部署编排（方案 A）。多副本前需先完成存储与验证码改造，见部署文档第五节。
# 启动：docker compose up -d --build
# 首次：migrate 服务会自动执行 prisma migrate deploy；失败时 web 不会启动。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhixue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zhixue_classroom}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhixue} -d ${POSTGRES_DB:-zhixue_classroom}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: zhixue-app:latest
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zhixue}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zhixue_classroom}?schema=public
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    image: zhixue-app:latest
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zhixue}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zhixue_classroom}?schema=public
      LOCAL_UPLOAD_ROOT: /app/.data/uploads
      LOGIN_CAPTCHA_STORAGE_DIR: /app/.data/login-captcha
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/.data/uploads
      - captcha:/app/.data/login-captcha
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  background-worker:
    image: zhixue-app:latest
    restart: unless-stopped
    command: ["node", ".data/background-worker-build/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zhixue}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zhixue_classroom}?schema=public
      LOCAL_UPLOAD_ROOT: /app/.data/uploads
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/.data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  judge-worker:
    image: zhixue-app:latest
    restart: unless-stopped
    command: ["node", ".data/programming-judge-worker-build/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zhixue}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zhixue_classroom}?schema=public
      TZ: Asia/Shanghai
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
  captcha:
